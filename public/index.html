</head>
<body>
<div class="shell" id="shell">
  <header class="top">
    <div class="nav-wrap">
      <button class="icon-btn" id="menuBtn" aria-label="Menü" title="Menü" data-action="toggle-rail"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="menu nav-menu" id="navMenu" hidden>
        <button data-action="nav" data-view="dashboard"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg> Genel bakış</button>
        <button data-action="nav" data-view="materials"><svg class="i" viewBox="0 0 24 24"><path d="M4 7l8-4 8 4-8 4-8-4zM4 7v10l8 4 8-4V7M12 11v10"/></svg> Malzemeler ve stok</button>
        <button data-action="nav" data-view="movements"><svg class="i" viewBox="0 0 24 24"><path d="M4 9h12l-3-3M20 15H8l3 3"/></svg> Hareketler (giriş / çıkış)</button>
        <button data-action="nav" data-view="alerts"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 16H3zM12 10v4M12 17.5v.5"/></svg> Alarmlar</button>
        <button data-action="nav" data-view="chat"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg> Sohbet</button>
        <div class="sep"></div>
        <button data-action="new-movement" data-kind="in"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg> Yeni giriş fişi</button>
        <button data-action="new-movement" data-kind="out"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg> Yeni çıkış fişi</button>
        <button data-action="new-material"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Yeni malzeme kartı</button>
        <div class="sep"></div>
        <button data-action="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg> Ayarlar ve bildirimler</button>
      </div>
    </div>
    <div class="brand">
      <span class="brand-logo"><img src="/img/peakpv-logo.png" alt="Peak PV Solar"></span>
      <span class="brand-text">
        <span class="brand-name">Malzeme Takip</span>
        <span class="brand-sub">Peak PV Solar · Fabrika Stok Takibi</span>
      </span>
    </div>
    <div class="top-right">
      <div class="presence" id="presence" title="Şu an bağlı"></div>
      <div class="live" id="live"><span class="dot"></span><span id="liveText">Bağlanıyor</span></div>
      <button class="icon-btn settings-btn" id="chatBtn" data-action="nav" data-view="chat" aria-label="Sohbet" title="Sohbet — ekip içi mesajlaşma"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="todo-count chat-count" id="chatCount" hidden></span></button>
      <div class="inbox-wrap" id="inboxWrap">
        <button class="icon-btn settings-btn" id="inboxBtn" data-action="open-inbox" aria-label="Bildirimler" title="Bildirimler — son hareketler ve alarmlar" aria-haspopup="true" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"/></svg><span class="todo-count inbox-count" id="inboxCount" hidden></span></button>
      </div>
      <button class="icon-btn settings-btn" id="settingsBtn" data-action="settings" aria-label="Ayarlar" title="Ayarlar"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span class="settings-dot" id="settingsDot" hidden></span></button>
      <div class="me" id="meBox"></div>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="alarmBar" class="alarm-bar" data-action="nav" data-view="alerts" hidden></div>
  <div class="body">
    <div class="backdrop" id="backdrop" data-action="toggle-rail"></div>
    <aside class="rail" id="rail">
      <div class="rail-head">
        <input type="search" id="search" placeholder="Malzeme, kod, kategori ara" aria-label="Malzeme ara">
        <div class="btn-row">
          <button class="btn primary" data-action="new-movement" data-kind="in"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Giriş</button>
          <button class="btn out-btn" data-action="new-movement" data-kind="out"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Çıkış</button>
        </div>
      </div>
      <div class="chips" id="stateChips"></div>
      <div class="rail-list" id="railList"></div>
      <div class="rail-foot">
        <label><input type="checkbox" id="showInactive"> Pasifleri göster</label>
        <span id="matCount"></span>
      </div>
    </aside>
    <main class="pane" id="pane">
      <div class="pane-head" id="paneHead"></div>
      <div class="pane-body" id="paneBody"></div>
    </main>
  </div>
  <div class="inbox" id="inbox" role="dialog" aria-label="Bildirimler" hidden></div>
  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="ntoast" id="ntoast" role="status" hidden></div>
  <div class="lightbox" id="lightbox" hidden></div>
</div>
<script src="/app.js?v=20261022"></script>
<script src="/pwa.js?v=20261021"></script>
</body>
</html>
